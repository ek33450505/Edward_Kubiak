<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Cartographic register mark: a survey crosshair on a parchment plate.
       Mirrors the masthead ⌖. Contour green on parchment, sepia neatline. -->
  <rect x="2" y="2" width="96" height="96" rx="8" fill="#F5F1E6"/>
  <rect x="6.5" y="6.5" width="87" height="87" rx="5" fill="none" stroke="#CDBFA0" stroke-width="2"/>
  <g stroke="#3A5540" fill="none" stroke-width="6" stroke-linecap="butt">
    <line x1="50" y1="12" x2="50" y2="88"/>
    <line x1="14" y1="50" x2="86" y2="50"/>
    <circle cx="50" cy="50" r="19"/>
  </g>
</svg>
