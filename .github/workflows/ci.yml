name: CI Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # HARD RULE: never `npm run build` in automation — its prebuild churns
      # src/data/castStats.js and trips the stats-drift gate. Verify to a temp dir.
      - name: Build verification
        run: npx vite build --outDir /tmp/vite-verify

      # Per team policy, passing tests are NOT a hard merge gate — run advisory.
      - name: Test (advisory)
        run: npm test -- --run
        continue-on-error: true

      # Explicit so the gate does not depend on puppeteer's postinstall having
      # run (npm may skip unapproved install scripts).
      - name: Install Chrome for the accessibility scan
        run: npx puppeteer browsers install chrome

      # Scans every route at desktop and phone widths with axe, reflow and
      # keyboard checks. BLOCKING: fails the job on any violation. Runs after
      # the advisory tests so their output is always printed.
      - name: Accessibility gate (WCAG 2.2 AA)
        run: node scripts/a11y-scan.mjs --dir /tmp/vite-verify --concurrency 2 --json /tmp/a11y-report.json

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: /tmp/a11y-report.json
          if-no-files-found: ignore
