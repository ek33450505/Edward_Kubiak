      #           res.on('data', (chunk) => data += chunk);
      #           res.on('end', () => {
      #             try {
      #               if (res.statusCode < 200 || res.statusCode >= 300) {
      #                 throw new Error(`stats API returned ${res.statusCode}`);
      #               }
      #               const s = JSON.parse(data);
      #               const out = {
      #                 available: true,
      #                 ytdRunDistance: s.ytd_run_totals?.distance ?? 0,
      #                 ytdRunElevation: s.ytd_run_totals?.elevation_gain ?? 0,
      #                 ytdRunCount: s.ytd_run_totals?.count ?? 0,
      #                 allTimeRunDistance: s.all_run_totals?.distance ?? 0,
      #                 allTimeRunCount: s.all_run_totals?.count ?? 0,
      #                 biggestRunDistance: s.biggest_run_distance ?? 0,
      #                 biggestClimbElevation: s.biggest_climb_elevation_gain ?? 0,
      #                 recentRunDistance30d: s.recent_run_totals?.distance ?? 0,
      #                 updated: new Date().toISOString(),
