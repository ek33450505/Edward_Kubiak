name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub activity and write static JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/ek33450505/events?per_page=30" \
            -o raw_events.json

          node << 'EOF'
          const fs = require('fs');
          const events = JSON.parse(fs.readFileSync('raw_events.json', 'utf8'));
          if (!Array.isArray(events)) {
            console.error('GitHub API did not return an array:', JSON.stringify(events).slice(0, 200));
            fs.writeFileSync('public/github-activity.json', JSON.stringify([]));
            process.exit(0);
          }
          const pushEvents = events
            .filter(e => e.type === 'PushEvent' && e.payload && e.payload.commits && e.payload.commits.length > 0)
            .flatMap(e =>
              e.payload.commits.map((c, idx) => ({
                id: `${e.id}-${idx}`,
                repo: e.repo.name.replace('ek33450505/', ''),
                repoFull: e.repo.name,
                sha: c.sha,
                message: c.message.split('\n')[0],
                time: e.created_at
              }))
            )
            .slice(0, 10);
          fs.writeFileSync('public/github-activity.json', JSON.stringify(pushEvents));
          console.log('Wrote', pushEvents.length, 'commits');

          // Also write last-known-commits.json as fallback for CurrentlyBuilding
          if (pushEvents.length > 0) {
            const lastKnownCommits = {
              commits: pushEvents,
              cachedAt: new Date().toISOString()
            };
            fs.writeFileSync('public/last-known-commits.json', JSON.stringify(lastKnownCommits));
            console.log('Wrote last-known-commits.json for fallback');
          }
          EOF

      - name: Fetch GitHub repo stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          const repos = [
            'claude-agent-team',
            'claude-code-dashboard',
            'cast-agents',
            'cast-observe',
            'cast-security',
            'cast-hooks',
            'cast-dash',
            'cast-memory',
            'cast-parallel',
            'cast-routines',
            'cast-doctor',
            'cast-time',
            'cast-website',
            'cast-claudes_journal',
            'cast-desktop',
            'promptbot',
          ];

          const token = process.env.GH_TOKEN;

          async function fetchStars(repo) {
            return new Promise((resolve) => {
              const options = {
                hostname: 'api.github.com',
                path: `/repos/ek33450505/${repo}`,
                headers: {
                  'User-Agent': 'github-actions',
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                },
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    resolve({ repo, stars: json.stargazers_count ?? 0 });
                  } catch {
                    resolve({ repo, stars: 0 });
                  }
                });
              }).on('error', () => resolve({ repo, stars: 0 }));
            });
          }

          (async () => {
            const results = await Promise.all(repos.map(fetchStars));
            const map = {};
            for (const { repo, stars } of results) {
              map[repo] = stars;
            }
            fs.writeFileSync('public/github-stars.json', JSON.stringify(map, null, 2));
            console.log('Wrote github-stars.json:', map);
          })();
          EOF

      - name: Fetch CAST stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch README and VERSION from claude-agent-team
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/ek33450505/claude-agent-team/main/README.md" \
            -o /tmp/cast-readme.md || true
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/ek33450505/claude-agent-team/main/VERSION" \
            -o /tmp/cast-version.txt || true

          node << 'EOF'
          (async () => {
          const fs = require('fs');
          const https = require('https');

          // Fallback values — bump these to match castframework.dev whenever the
          // dynamic fetch is unavailable. Auto-derived values override below.
          const fallback = {
            version: 'v9.0.0',
            agents: 23,
            tests: 2068,
            packages: 9,
            commands: 21,
            skills: 17,
            tables: 38,
          };

          let version = fallback.version;
          let agents = fallback.agents;
          let tests = fallback.tests;
          let packages = fallback.packages;
          let commands = fallback.commands;
          let skills = fallback.skills;
          let tables = fallback.tables;
          const token = process.env.GH_TOKEN;

          try {
            // Parse version: prefer VERSION file, fall back to README
            const versionFile = fs.readFileSync('/tmp/cast-version.txt', 'utf8').trim();
            if (versionFile && /^\d+\.\d+/.test(versionFile)) {
              version = `v${versionFile}`;
            } else {
              const readme = fs.readFileSync('/tmp/cast-readme.md', 'utf8');
              const vMatch = readme.match(/CAST\s+v(\d+\.\d+)/i);
              if (vMatch) version = `v${vMatch[1]}`;
            }
          } catch { /* use fallback */ }

          try {
            const readme = fs.readFileSync('/tmp/cast-readme.md', 'utf8');
            // Parse agents from badge URL: badge/agents-30 or similar
            const agentMatch = readme.match(/badge\/agents-(\d+)/);
            if (agentMatch) agents = parseInt(agentMatch[1], 10);

            // Parse tests from badge URL: badge/tests-409 or similar
            const testMatch = readme.match(/badge\/tests-(\d+)/);
            if (testMatch) tests = parseInt(testMatch[1], 10);

            // Parse skills from badge URL: badge/skills-N or similar
            const skillMatch = readme.match(/badge\/skills-(\d+)/);
            if (skillMatch) skills = parseInt(skillMatch[1], 10);
          } catch { /* use fallback */ }

          // Fetch packages: count homebrew-* repos excluding archived ones
          try {
            const repoData = await new Promise((resolve) => {
              const options = {
                hostname: 'api.github.com',
                path: '/users/ek33450505/repos?per_page=100',
                headers: {
                  'User-Agent': 'github-actions',
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                },
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    const archived = ['homebrew-jarvis', 'homebrew-engram', 'homebrew-stratum'];
                    const homebrewCount = (Array.isArray(json) ? json : [])
                      .filter(r => r.name.startsWith('homebrew-') && !r.archived && !archived.includes(r.name))
                      .length;
                    resolve(homebrewCount);
                  } catch {
                    resolve(fallback.packages);
                  }
                });
              }).on('error', () => resolve(fallback.packages));
            });
            packages = repoData;
          } catch { /* use fallback */ }

          // Fetch commands: count .md files in claude-agent-team commands directory
          try {
            const commandCount = await new Promise((resolve) => {
              const options = {
                hostname: 'api.github.com',
                path: '/repos/ek33450505/claude-agent-team/contents/commands',
                headers: {
                  'User-Agent': 'github-actions',
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                },
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    const mdCount = (Array.isArray(json) ? json : [])
                      .filter(f => f.name && f.name.endsWith('.md'))
                      .length;
                    resolve(mdCount > 0 ? mdCount : fallback.commands);
                  } catch {
                    resolve(fallback.commands);
                  }
                });
              }).on('error', () => resolve(fallback.commands));
            });
            commands = commandCount;
          } catch { /* use fallback */ }

          // Overlay canonical values from flagship cast-stats.json.
          // If the fetch succeeds, canonical values take precedence over the
          // individually-computed values above. Any extra fields this script
          // computes (e.g. verified_at) are preserved via the spread below.
          const CANONICAL_URL = 'https://raw.githubusercontent.com/ek33450505/claude-agent-team/main/cast-stats.json';
          let canonical = {};
          try {
            const canonicalRaw = await new Promise((resolve, reject) => {
              https.get(CANONICAL_URL, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
            canonical = JSON.parse(canonicalRaw);
            // Normalise version field: canonical uses bare semver (e.g. "7.4.1"),
            // but this script expects "v7.4.1" — ensure the v-prefix is present.
            if (canonical.version && !String(canonical.version).startsWith('v')) {
              canonical.version = `v${canonical.version}`;
            }
            console.log('Fetched canonical stats:', canonical);
          } catch (e) {
            console.warn('Canonical fetch failed — using computed values. Error:', e.message);
          }

          const stats = {
            version,
            agents,
            tests,
            packages,
            commands,
            skills,
            tables,
            verified_at: new Date().toISOString(),
            updated: new Date().toISOString(),
            // Canonical overlay: trusted values from the flagship repo
            ...canonical,
          };
          console.log('Will write:', JSON.stringify(stats, null, 2));
          fs.writeFileSync('public/cast-stats.json', JSON.stringify(stats, null, 2));
          console.log('Wrote cast-stats.json:', stats);
          })();
          EOF

