      #     EOF

      - name: Generate RSS feed
        run: node scripts/generate-rss.mjs

      - name: Generate per-project OG images
        run: |
          node --input-type=module << 'EOF'
          import fs from 'fs';
          import { spawnSync } from 'child_process';
          const projectsModule = await import('./src/data/projects.js');
          const projects = projectsModule.default || [];

          for (const project of projects) {
            const result = spawnSync('node', [
              'scripts/generate-og-image.mjs',
              '--slug', project.slug,
              '--title', project.title,
              '--outDir', 'public/og'
            ], { stdio: 'inherit' });
            if (result.status !== 0) {
              console.warn(`Failed to generate OG image for ${project.slug}`);
            }
          }
          EOF

      # prebuild's sync-* scripts read GITHUB_TOKEN (sent only to api.github.com) for the
      # authenticated rate limit; sync-github-activity owns github-activity.json and
      # last-known-commits.json.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # Both PDFs are rendered here from the data this deploy just synced, so the
      # live PDFs are as fresh as the site. They render into a temp dir and are
      # copied over dist/'s committed copies only if BOTH rendered (including the
      # page-budget check); the copy itself is not atomic. Any failure or hang
      # ships the committed PDFs with a warning; a PDF problem never blocks a
      # deploy (Ed, 2026-10-20).
      # Every command sits in the `if` list, so under `bash -e` none can abort.
      # Chrome runs with --no-sandbox under CI, so the OIDC request vars (present
      # because of id-token: write) are stripped from its environment.
      # timeout-minutes + continue-on-error: even a hang the inner timeouts miss
      # (a Chrome grandchild) ends this step without failing the deploy.
      - name: Render PDFs (fresh, best-effort)
        timeout-minutes: 20
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/pdfs"
          noid=(env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)
          if timeout -k 30 600 "${noid[@]}" npx puppeteer browsers install chrome \
             && RESUME_PDF_OUT_DIR="$out" timeout -k 30 300 "${noid[@]}" node scripts/build-resume-pdf.mjs \
             && [[ -s "$out/Edward_Kubiak_Resume.pdf" && -s "$out/CAST_Portfolio_OnePager.pdf" ]] \
             && cp "$out/Edward_Kubiak_Resume.pdf" "$out/CAST_Portfolio_OnePager.pdf" dist/; then
            echo "Rendered both PDFs fresh into dist/."
            echo "PDFs: rendered fresh from this deploy's data." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=PDFs::PDF rendering failed; deploying the committed PDFs (or, if the copy failed midway, one fresh and one committed)."
            echo "PDFs: rendering FAILED, so committed (possibly stale) PDFs were deployed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # On 2026-09-09 this workflow reported success for three consecutive runs
      # while edwardkubiak.com served GitHub's "Site not found" page: the repo had
      # gone private, Pages was disabled, and deploy-pages created a deployment
      # that went nowhere. A green check that proves nothing.
      #
      # What a PASSING check looks like while that bug is present: the site returns
      # 404 and does not contain the marker, so this step fails. That is the whole
      # point — it asserts the served result, not the API call.
      - name: Verify the deployment is actually serving
        run: |
          set -uo pipefail
          URL="https://edwardkubiak.com/"
          MARKER="Edward Kubiak"
          for attempt in $(seq 1 10); do
            # Capture status the instant curl returns; never let a pipe be last.
            body="$(curl -sSL --max-time 20 -w '\n%{http_code}' "$URL" 2>/dev/null)"; rc=$?
            code="$(printf '%s' "$body" | tail -n1)"
            if [ "$rc" -eq 0 ] && [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$MARKER"; then
              echo "Serving: HTTP $code and the marker is present (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: curl rc=$rc, status=${code:-none}, marker=$(printf '%s' "$body" | grep -cF "$MARKER") — retrying in 20s"
            sleep 20
          done
          echo "::error::Deployment did not become live. $URL never returned 200 with the expected content."
          echo "Check that the repository is public and GitHub Pages is enabled (build_type=workflow)."
          exit 1
