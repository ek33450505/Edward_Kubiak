name = "ek-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [{ pattern = "contact.edwardkubiak.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://edwardkubiak.com"
FROM_EMAIL = "Portfolio Contact <portfolio@compute-atlas.com>"
TURNSTILE_EXPECTED_HOSTNAME = "edwardkubiak.com"

# Secrets (set with `npx wrangler secret put`, never committed):
#   RESEND_API_KEY, CONTACT_TO_EMAIL, TURNSTILE_SECRET

[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
